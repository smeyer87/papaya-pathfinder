        kicadPinName: "ESP32_ground_near_TX(socket_pin)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.10
        label: "ESP32 GPIO10 - BTS2 pin 1, R-PWM (socket pin)"
        kicadPinName: "ESP32_GPIO10-BTS2_pin1_R-PWM(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.11
        label: "ESP32 GPIO11 - BTS2 pin 2, L-PWM (socket pin)"
        kicadPinName: "ESP32_GPIO11-BTS2_pin2_L-PWM(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.12
        label: "ESP32 GPIO12 - BTS1 pin 1, R-PWM (socket pin)"
        kicadPinName: "ESP32_GPIO12-BTS1_pin1_R-PWM(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.13
        label: "ESP32 GPIO13 - BTS1 pin 2, L-PWM (socket pin)"
        kicadPinName: "ESP32_GPIO13-BTS1_pin2_L-PWM(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.21
        label: "ESP32 GPIO21 - ELRS RX, white wire (socket pin)"
        kicadPinName: "ESP32_GPIO21-ELRS_RX_white(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.47
        label: "ESP32 GPIO47 - ELRS TX, green wire (socket pin)"
        kicadPinName: "ESP32_GPIO47-ELRS_TX_green(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.38
        label: "ESP32 GPIO38 - S4 (Left-Rear) servo signal (socket pin)"
        kicadPinName: "ESP32_GPIO38-S4-LR_signal(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.41
        label: "ESP32 GPIO41 - S3 (Right-Rear) servo signal (socket pin)"
        kicadPinName: "ESP32_GPIO41-S3-RR_signal(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.42
        label: "ESP32 GPIO42 - S1 (Right-Front) servo signal (socket pin)"
        kicadPinName: "ESP32_GPIO42-S1-RF_signal(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      # Solder pads for the UBEC 5V/3A module (see u2 component).
      - id: J_UBEC5V.INP
        label: "UBEC 5V IN+ pad"
        kicadPinName: "U2_5V_IN-POS"
        connector: {type: solderPad, footprint: "papaya-pcb:UBEC_5V_3A_10x15mm" }
      - id: J_UBEC5V.INN
        label: "UBEC 5V IN- pad"
        kicadPinName: "U2_5V_IN-NEG"
        connector: {type: solderPad, footprint: "papaya-pcb:UBEC_5V_3A_10x15mm" }
      - id: J_UBEC5V.OUTP
        label: "UBEC 5V OUT+ pad"
        kicadPinName: "U2_5V_OUT_POS"
        connector: {type: solderPad, footprint: "papaya-pcb:UBEC_5V_3A_10x15mm" }
      - id: J_UBEC5V.OUTN
        label: "UBEC 5V OUT- pad"
        kicadPinName: "U2_5V_OUT-NEG"
        connector: {type: solderPad, footprint: "papaya-pcb:UBEC_5V_3A_10x15mm" }
      # BTS1/BTS2 low-current logic pin headers (see BTS1/BTS2 components).
      # Pins 3/4/7 (R-EN, L-EN, VCC) ride the 5V bus; pin 8 (GND) rides
      # the ground bus — see bondedGroups below.
      - id: J_BTS1.1
        label: "BTS1 pin 1 - R-PWM"
        kicadPinName: "BTS1_pin1-R-PWM"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS1.2
        label: "BTS1 pin 2 - L-PWM"
        kicadPinName: "BTS1_pin2-L-PWM"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS1.3
        label: "BTS1 pin 3 - R-EN (5V bus)"
        kicadPinName: "BTS1_pin3-R-EN(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS1.4
        label: "BTS1 pin 4 - L-EN (5V bus)"
        kicadPinName: "BTS1_pin4-L-EN(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS1.7
        label: "BTS1 pin 7 - VCC (5V bus)"
        kicadPinName: "BTS1_pin7-VCC(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS1.8
        label: "BTS1 pin 8 - GND (ground bus)"
        kicadPinName: "BTS1_pin8-GND"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS2.1
        label: "BTS2 pin 1 - R-PWM"
        kicadPinName: "BTS2_pin1-R-PWM"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS2.2
        label: "BTS2 pin 2 - L-PWM"
        kicadPinName: "BTS2_pin2-L-PWM"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS2.3
        label: "BTS2 pin 3 - R-EN (5V bus)"
        kicadPinName: "BTS2_pin3-R-EN(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS2.4
        label: "BTS2 pin 4 - L-EN (5V bus)"
        kicadPinName: "BTS2_pin4-L-EN(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS2.7
        label: "BTS2 pin 7 - VCC (5V bus)"
        kicadPinName: "BTS2_pin7-VCC(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      - id: J_BTS2.8
        label: "BTS2 pin 8 - GND (ground bus)"
        kicadPinName: "BTS2_pin8-GND"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x06_BTS_Signal" }
      # Single 4-pin header for the ELRS receiver (VCC/GND/TX/RX together,
      # matching its own 4-wire red/black/green/white pigtail).
      - id: J_ELRS.VCC
        label: "ELRS VCC (5V bus)"
        kicadPinName: "ELRS_VCC(5V)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x04_ELRS" }
      - id: J_ELRS.GND
        label: "ELRS GND (ground bus)"
        kicadPinName: "ELRS_GND"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x04_ELRS" }
      - id: J_ELRS.TX
        label: "ELRS TX (green wire)"
        kicadPinName: "ELRS_TX(green)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x04_ELRS" }
      - id: J_ELRS.RX
        label: "ELRS RX (white wire)"
        kicadPinName: "ELRS_RX(white)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x04_ELRS" }
      # Master ground return to tb-power-dist.B14 — see bus-gnd bondedGroup.
      - id: J_GND_MASTER
        label: "Master ground OUT (to tb-power-dist.B14)"
        kicadPinName: "Master_GND_OUT(to_B14)"
        connector: {type: screwTerminal, footprint: "TerminalBlock:TerminalBlock_MaiXu_MX126-5.0-02P_1x02_P5.00mm" }
      # UBEC 6V/8A (U1) output screw terminals — feed the servo power bus.
      - id: J_UBEC6V.OUTP
        label: "UBEC 6V OUT+ (servo power bus)"
        kicadPinName: "U1_6V_OUT(servo_+)"
        connector: {type: screwTerminal, footprint: "papaya-pcb:TerminalBlock_2Pos_UBEC6V" }
      - id: J_UBEC6V.OUTN
        label: "UBEC 6V OUT- (servo power bus return)"
        kicadPinName: "U1_6V_OUT(servo_GND)"
        connector: {type: screwTerminal, footprint: "papaya-pcb:TerminalBlock_2Pos_UBEC6V" }
      # Per-servo 3-pin headers, physical pin order Black(GND)-Red(PWR)-White(SIG),
      # matching each servo's own connector. PWR joins bus-6v, GND joins bus-gnd,
      # SIG gets its own trace from the matching ESP32 socket pin.
      - id: J_S1.GND
        label: "S1 header pin 1 - GND (black)"
        kicadPinName: "S1_pin1-GND(black)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S1.PWR
        label: "S1 header pin 2 - PWR (red)"
        kicadPinName: "S1_pin2-PWR(red)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S1.SIG
        label: "S1 header pin 3 - SIG (white)"
        kicadPinName: "S1_pin3-SIG(white)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S2.GND
        label: "S2 header pin 1 - GND (black)"
        kicadPinName: "S2_pin1-GND(black)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S2.PWR
        label: "S2 header pin 2 - PWR (red)"
        kicadPinName: "S2_pin2-PWR(red)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S2.SIG
        label: "S2 header pin 3 - SIG (white)"
        kicadPinName: "S2_pin3-SIG(white)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S3.GND
        label: "S3 header pin 1 - GND (black)"
        kicadPinName: "S3_pin1-GND(black)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S3.PWR
        label: "S3 header pin 2 - PWR (red)"
        kicadPinName: "S3_pin2-PWR(red)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S3.SIG
        label: "S3 header pin 3 - SIG (white)"
        kicadPinName: "S3_pin3-SIG(white)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S4.GND
        label: "S4 header pin 1 - GND (black)"
        kicadPinName: "S4_pin1-GND(black)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S4.PWR
        label: "S4 header pin 2 - PWR (red)"
        kicadPinName: "S4_pin2-PWR(red)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
      - id: J_S4.SIG
        label: "S4 header pin 3 - SIG (white)"
        kicadPinName: "S4_pin3-SIG(white)"
        connector: {type: pinHeader, footprint: "papaya-pcb:PinHeader_1x03_Servo" }
    bondedGroups:
      - id: bus-5v
        points: [J_UBEC5V.OUTP, J_ESP32.5V, J_BTS1.3, J_BTS1.4, J_BTS1.7, J_BTS2.3, J_BTS2.4, J_BTS2.7, J_ELRS.VCC]
        notes: "On-board 5V distribution bus (copper pour / wide trace), fed by U2 (UBEC 5V/3A)"
      - id: bus-6v
        points: [J_UBEC6V.OUTP, J_S1.PWR, J_S2.PWR, J_S3.PWR, J_S4.PWR]
        notes: "On-board 6V servo power bus, fed by U1 (UBEC 6V/8A)"
      - id: bus-gnd
        points: [J_UBEC5V.OUTN, J_UBEC6V.OUTN, J_ESP32.GND_1, J_ESP32.GND_2, J_BTS1.8, J_BTS2.8, J_ELRS.GND, J_S1.GND, J_S2.GND, J_S3.GND, J_S4.GND, J_GND_MASTER]
        notes: "On-board common ground bus (5V, 6V, and logic returns all share one ground); J_GND_MASTER carries it back off-board to tb-power-dist.B14"

# -----------------------------------------------------------------------------
# CONNECTIONS
# -----------------------------------------------------------------------------
# One entry per physical wire or PCB trace. `from`/`to` reference a
# component id + one of its connectionPoints ids. Order doesn't imply
# direction unless noted. See "CONNECTION MEDIUM" above for `medium.kind`.
connections:
  - id: conn-001
    from: { component: battery-main, point: POS }
    to: { component: fuse-main, point: IN }
    medium:
      kind: wire
      color: red
      gauge: "14 AWG"
      lengthMm: null
    notes: ""

  - id: conn-002
    from: { component: fuse-main, point: OUT }
    to: { component: switch-main, point: IN }
    medium:
      kind: wire
      color: red
      gauge: "14 AWG"
      lengthMm: null
    notes: ""

  - id: conn-003
    from: { component: switch-main, point: OUT }
    to: { component: tb-power-dist, point: A-IN }
    medium:
      kind: wire
      color: red
      gauge: "14 AWG"
      lengthMm: null
    notes: ""

  - id: conn-004
    from: { component: battery-main, point: NEG }
    to: { component: tb-power-dist, point: B-IN }
    medium:
      kind: wire
      color: black
      gauge: "14 AWG"
      lengthMm: null
    notes: ""

  - id: conn-005
    from: { component: tb-power-dist, point: A13 }
    to: { component: board-main, point: J1.1 }
    medium:
      kind: wire
      color: red
      gauge: "18 AWG"
      lengthMm: null
    notes: "Main battery power in from distribution block, NOT stepped down yet"

  # --- example: off-board module -> board connector (still a wire; this
  # is the ESP32 module's pin mating into the board's socket header) ---
  - id: conn-006
    from: { component: esp32, point: GPIO7 }
    to: { component: board-main, point: J_ESP32.7 }
    medium:
      kind: wire
      color: ""
      gauge: "22 AWG"
      lengthMm: null
    notes: "ESP32 module plugged into on-board socket header"

  # --- example: board-internal PCB trace (both endpoints on board-main) ---
  - id: conn-007
    from: { component: board-main, point: J_ESP32.7 }
    to: { component: board-main, point: J_S2.SIG }
    medium:
      kind: trace
      layer: "F.Cu"
      widthMm: 0.5
    notes: "Routes ESP32 GPIO7 to the S2 (Left-Front) servo header; actual copper path is whatever KiCad routes"

  # --- corrected: tb-motor-bus is fed by the BTS driver's output, not
  # directly by the switch/distribution — see BTS1/BTS2 connections below
  # (was a placeholder before BTS1/BTS2 were defined; superseded).
  # id: conn-008 retired — replaced by conn-024 (BTS1 M+ -> tb-motor-bus.A1)

  # --- example: small solder-mounted module -> board pads (UBEC 5V/3A) ---
  # Same offBoard-module -> board-connector pattern as the ESP32, but
  # since the UBEC is soldered directly rather than socketed, these
  # "wires" are really just solder joints — color/gauge left blank.
  - id: conn-009
    from: { component: u2, point: IN+ }
    to: { component: board-main, point: J_UBEC5V.INP }
    medium:
      kind: wire
      color: ""
      gauge: ""
      lengthMm: null
    notes: "Direct solder pad, no discrete wire"

  - id: conn-010
    from: { component: u2, point: IN- }
    to: { component: board-main, point: J_UBEC5V.INN }
    medium:
      kind: wire
      color: ""
      gauge: ""
      lengthMm: null
    notes: "Direct solder pad, no discrete wire"

  - id: conn-011
    from: { component: u2, point: OUT+ }
    to: { component: board-main, point: J_UBEC5V.OUTP }
    medium:
      kind: wire
      color: ""
      gauge: ""
      lengthMm: null
    notes: "Direct solder pad, no discrete wire"

  - id: conn-012
    from: { component: u2, point: OUT- }
    to: { component: board-main, point: J_UBEC5V.OUTN }
    medium:
      kind: wire
      color: ""
      gauge: ""
      lengthMm: null
    notes: "Direct solder pad, no discrete wire"

  # --- example: UBEC output distributed onward via board traces ---
  - id: conn-013
    from: { component: esp32, point: 5V_IN }
    to: { component: board-main, point: J_ESP32.5V }
    medium:
      kind: wire
      color: ""
      gauge: "22 AWG"
      lengthMm: null
    notes: "ESP32 module plugged into on-board socket header"

  # id: conn-014 retired — J_UBEC5V.OUTP and J_ESP32.5V are now both
  # members of board-main's "bus-5v" bondedGroup, which already declares
  # them the same net; the explicit point-to-point trace is redundant.

  # --- example: raw battery voltage in, routed to the UBEC's input pad ---
  - id: conn-015
    from: { component: board-main, point: J1.1 }
    to: { component: board-main, point: J_UBEC5V.INP }
    medium:
      kind: trace
      layer: "F.Cu"
      widthMm: "" # high-current — size for total 3S draw into this UBEC, not the usual signal-trace default
    notes: "Carries raw 3S pack voltage into the UBEC's input, not 5V"

  - id: conn-016
    from: { component: tb-power-dist, point: B13 }
    to: { component: board-main, point: J1.2 }
    medium:
      kind: wire
      color: black
      gauge: "18 AWG"
      lengthMm: null
    notes: "Main battery return (-) in from distribution block"

  - id: conn-017
    from: { component: board-main, point: J1.2 }
    to: { component: board-main, point: J_UBEC5V.INN }
    medium:
      kind: trace
      layer: "F.Cu"
      widthMm: "" # high-current — size for total 3S draw into this UBEC, not the usual signal-trace default
    notes: "Battery return (-) into the UBEC's input"

  # --- ESP32 low-current signal pins: module -> board socket header ---
  - id: conn-018
    from: { component: esp32, point: GPIO10 }
    to: { component: board-main, point: J_ESP32.10 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header"

  - id: conn-019
    from: { component: esp32, point: GPIO11 }
    to: { component: board-main, point: J_ESP32.11 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header"

  - id: conn-020
    from: { component: esp32, point: GPIO12 }
    to: { component: board-main, point: J_ESP32.12 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header"

  - id: conn-021
    from: { component: esp32, point: GPIO13 }
    to: { component: board-main, point: J_ESP32.13 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header"

  - id: conn-022
    from: { component: esp32, point: GPIO21 }
    to: { component: board-main, point: J_ESP32.21 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header"

  - id: conn-023
    from: { component: esp32, point: GPIO47 }
    to: { component: board-main, point: J_ESP32.47 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header"

  - id: conn-023b
    from: { component: esp32, point: GND_1 }
    to: { component: board-main, point: J_ESP32.GND_1 }
    medium: { kind: wire, color: "", gauge: "22 AWG", lengthMm: null }
    notes: "ESP32 module plugged into on-board socket header; feeds board-main's ground bus"

  # --- BTS1: high-current screw terminals wire DIRECTLY to the terminal
  # blocks, bypassing the board (per guidance on not routing pack current
  # across the small PCB). This also supersedes the old conn-008 placeholder.
  - id: conn-024
    from: { component: BTS1, point: "M+" }
    to: { component: tb-motor-bus, point: A1 }
    medium: { kind: wire, color: red, gauge: "18 AWG", lengthMm: null }
    notes: "BTS1 driver output, right-side motor power"

  - id: conn-025
    from: { component: BTS1, point: "M-" }
    to: { component: tb-motor-bus, point: B1 }
    medium: { kind: wire, color: black, gauge: "18 AWG", lengthMm: null }
    notes: "BTS1 driver output return, right-side motor return"

  - id: conn-026
    from: { component: BTS1, point: "B+" }
    to: { component: tb-power-dist, point: A7 }
    medium: { kind: wire, color: red, gauge: "18 AWG", lengthMm: null }
    notes: "BTS1 high-current motor supply in"


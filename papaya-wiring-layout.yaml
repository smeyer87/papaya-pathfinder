# =============================================================================
# Papaya Pathfinder — System Wiring Layout
# =============================================================================
# This file describes the FULL electrical system, not just the custom PCB:
# battery, protection/switching, terminal blocks, off-board modules (ESP32,
# motor drivers, motors, servos, ELRS receiver, UBECs...) and the custom board
# itself. The goal is a single source of truth that can drive:
#   - a KiCad schematic (pathfinder/kicad/papaya-pcb/papaya-pcb.kicad_sch)
#   - a KiCad PCB layout (pathfinder/kicad/papaya-pcb/papaya-pcb.kicad_pcb)
#   - build/wiring documentation
#
# STRUCTURE
#   system      -- overall metadata
#   components  -- every physical part in the system (see componentType below)
#   connections -- every wire/trace between two connection points
#
# componentType values:
#   battery       - power source (e.g. LiPo pack)
#   fuse          - inline protection device
#   switch        - power switch / disconnect
#   terminalBlock - screw/terminal block used to distribute or join wires
#   offBoard      - any module NOT on the custom PCB (ESP32, motor driver,
#                   motor, servo, UBEC, receiver, antenna, connector, etc.)
#                   Use ONE component entry per physical part (e.g.
#                   bts7960-1, bts7960-2, motor-lf, motor-rf, servo-1...),
#                   not one entry per part type.
#   board         - the custom PCB itself (pathfinder/kicad/papaya-pcb).
#                   Once real KiCad connectors/designators exist, name each
#                   connectionPoint after its KiCad ref+pin (e.g. "J1.1",
#                   "J2.3") so this file can be cross-checked against the
#                   .kicad_sch netlist.
#
# Each component lists its own `connectionPoints` — the specific pins,
# terminals, pads, or screw positions that can be wired to. `connections`
# then references those points by (componentId, pointId) pairs.
#
# KICAD PIN NAME (generator output only — don't hand-author this)
#   `label` is the full descriptive text for docs/comments; the generated
#   schematic uses it as each pin's on-screen name, which gets unreadable
#   fast on symbols with many pins. Once you've tightened pin names up in
#   KiCad's Symbol Editor for legibility, run
#   `python pathfinder/kicad/scripts/sync_pin_names.py` to pull those
#   shortened names back into each connectionPoint's `kicadPinName` field
#   (added alongside `label`, which is left untouched). Regenerating the
#   schematic afterward will use `kicadPinName` when present instead of
#   `label`, so your legibility pass survives a regeneration.
#
# CONNECTION MEDIUM (wire vs. PCB trace)
#   Every entry in `connections` has a `medium` describing HOW the two
#   points are physically joined:
#     kind: wire  - a physical wire (off-board, or terminal-block-to-board).
#                   Fields: color, gauge, lengthMm.
#     kind: trace - a copper trace on the custom PCB. Only valid when BOTH
#                   endpoints are on the `board` component. Fields: layer
#                   (e.g. "F.Cu"), widthMm. There's no "color" for a trace —
#                   this is where the abstraction shifts from a physical
#                   wire you cut/crimp to a route KiCad draws for you.
#   You don't need to pick trace-vs-wire yourself for on-board routing
#   beyond marking it `kind: trace`; once the schematic/PCB exists, the
#   actual copper path is whatever KiCad routes, not something you specify
#   here — this file just records the intended net.
#
# CONNECTOR TYPE (board connectionPoints only)
#   A board connectionPoint can optionally carry a `connector` block
#   describing what physical part needs to be populated there — this is
#   what tells KiCad (and you, at the workbench) whether a point is a
#   screw terminal, a solder pad, a pin header, or a socket header:
#     connector: { type: screwTerminal | solderPad | pinHeader | socketHeader, notes: "" }
#   Leave it off if you haven't decided yet; add it once you know what
#   needs to be soldered/mounted at that point.
#
# BONDED GROUPS (bus bars / ganged terminal positions)
#   Some components (most often a terminalBlock used as a distribution
#   bus) have several connectionPoints permanently tied together with a
#   hardwire jumper/bus bar, so they're all one electrical net. Instead of
#   writing a chain of jumper `connections`, list the tied points once in
#   that component's optional `bondedGroups`. Individual wires (e.g. the
#   feed-in, or the leg to one motor) still attach to a single point within
#   the group via a normal `connections` entry — the group just says "these
#   points are already the same node."
#   The same mechanism works on `board-main` for an on-board power/ground
#   bus (a copper pour or wide trace tying many pads to one net) — see
#   `bus-5v` / `bus-gnd` below. No individual point-to-point `connections`
#   entries are needed between members of the same bondedGroup.
#
# This is a STARTING STRUCTURE with one illustrative example per
# componentType. Replace/expand the example entries with real data from your
# worksheets; the shape (keys/fields) is what matters, not the sample values.
# =============================================================================

system:
  name: "Papaya Pathfinder"
  description: "Full-size Papaya Pathfinder rover — complete electrical system, on-board and off-board."
  notes: ""

# -----------------------------------------------------------------------------
# COMPONENTS
# -----------------------------------------------------------------------------
components:
  # --- battery -----------------------------------------------------------
  - id: battery-main
    componentType: battery
    name: "Main LiPo Battery"
    model: "LiPo 3S"
    notes: ""
    connectionPoints:
      - id: POS
        label: "Positive (+)"
        kicadPinName: "Positive_(+)"
      - id: NEG
        label: "Negative (-)"
        kicadPinName: "Negative_(-)"

  # --- fuse ----------------------------------------------------------------
  - id: fuse-main
    componentType: fuse
    name: "Main Power Fuse"
    model: "" # e.g. "10A blade fuse"
    notes: ""
    connectionPoints:
      - id: IN
        label: "Input (from battery)"
        kicadPinName: "Input"
      - id: OUT
        label: "Output (to switch/distribution)"
        kicadPinName: "Output"

  # --- switch --------------------------------------------------------------
  - id: switch-main
    componentType: switch
    name: "Main Power Switch"
    model: ""
    notes: ""
    connectionPoints:
      - id: IN
        label: "Input"
        kicadPinName: "Input"
      - id: OUT
        label: "Output"
        kicadPinName: "Output"

  # --- terminal block --------------------------------------------------------
  # Terminal blocks expose a grid of named positions, e.g. row A / row B,
  # numbered left-to-right. List every physical position you have available,
  # even if not all are used yet.
  - id: tb-power-dist
    componentType: terminalBlock
    name: "Power Distribution Terminal Block"
    model: "Marine-style screw terminal block, positions labeled by manufacturer up to 14"
    notes: "Terminal numbering is exactly as printed on the device, not sequential/consecutive. Block is mounted with only the top row accessible, so exact total position count and any positions below 6 or between 8-11 are unknown. Master Inputs for A-IN and B-IN then connect to all A and B terminals on the block."
    connectionPoints:
      - id: A-IN
        label: "A-Master Input"
        kicadPinName: "A-Master_Input"
      - id: B-IN
        label: "B-Master Input"
        kicadPinName: "B-Master_Input"
      - id: A7
        row: A
        number: 7
        label: "A7 - BTS1 supply +"
        kicadPinName: "A7-BTS1_supply(+)"
      - id: B7
        row: B
        number: 7
        label: "B7 - BTS1 supply -"
        kicadPinName: "B7-BTS1_supply(-)"
      - id: A6
        row: A
        number: 6
        label: "A6 - UBEC 6V/8A (U1) input +"
        kicadPinName: "A6-U1_in(+)"
      - id: B6
        row: B
        number: 6
        label: "B6 - UBEC 6V/8A (U1) input -"
        kicadPinName: "B6-U1_in(-)"
      - id: A14
        row: A
        number: 14
        label: "A14"
        kicadPinName: "A14-(Unused)"
      - id: B14
        row: B
        number: 14
        label: "B14 - board master ground return"
        kicadPinName: "B14-board_master_ground"
      - id: A13
        row: A
        number: 13
        label: "A13 - board main power in (feeds UBEC 5V/3A)"
        kicadPinName: "A13-board_(+)_power(U2)"
      - id: B13
        row: B
        number: 13
        label: "B13 - board main power return"
        kicadPinName: "B13-board_(-)_return(U2)"
      - id: A12
        row: A
        number: 12
        label: "A12 - BTS2 supply +"
        kicadPinName: "A12-BTS2_supply(+)"
      - id: B12
        row: B
        number: 12
        label: "B12 - BTS2 supply -"
        kicadPinName: "B12-BTS2_supply(-)"
    bondedGroups:
      - id: a-bus
        points: [A-IN, A6, A7, A12, A13, A14]
        notes: "Master A input is jumpered to every A-row terminal"
      - id: b-bus
        points: [B-IN, B6, B7, B12, B13, B14]
        notes: "Master B input is jumpered to every B-row terminal; this is the terminal block side of the full ground loop back through B14 -> board-main.J_GND_MASTER -> bus-gnd"

  # --- terminal block used as a distribution bus (bonded/ganged) -------------
  # Example modeled on a marine 8+8 terminal bus with hardwire jumpers
  # ganging groups of positions onto a single net, so one feed powers
  # several motors on the same side at once. (Odd motor # = right side,
  # even motor # = left side, per the rover's own numbering convention.)
  - id: tb-motor-bus
    componentType: terminalBlock
    name: "Motor Power Distribution Bus"
    model: "marine 8+8 position terminal bus" # e.g. "marine 8+8 position terminal bus"
    notes: "Positions within a bondedGroup are tied together by a physical hardwire jumper, not a discrete wire."
    connectionPoints:
      - {
          id: A1,
          row: A,
          number: 1,
          label: "Right power - from BTS1 M+ (driver output)",
          kicadPinName: "BTS1(M+)",
        }
      - { id: A2, row: A, number: 2, label: "Right power - to Motor 1", kicadPinName: "M1(+)" }
      - { id: A3, row: A, number: 3, label: "Right power - to Motor 3", kicadPinName: "M3(+)" }
      - { id: A4, row: A, number: 4, label: "Right power - to Motor 5", kicadPinName: "M5(+)" }
      - {
          id: A5,
          row: A,
          number: 5,
          label: "Left power - from BTS2 M+ (driver output)",
          kicadPinName: "BTS2(M+)",
        }
      - { id: A6, row: A, number: 6, label: "Left power - to Motor 2", kicadPinName: "M2(+)" }
      - { id: A7, row: A, number: 7, label: "Left power - to Motor 4", kicadPinName: "M4(+)" }
      - { id: A8, row: A, number: 8, label: "Left power - to Motor 6", kicadPinName: "M6(+)" }
      - { id: B1, row: B, number: 1, label: "Right return - from BTS1 M- (driver output)", kicadPinName: "BTS1(M-)" }
      - { id: B2, row: B, number: 2, label: "Right return - from Motor 1", kicadPinName: "M1(-)" }
      - { id: B3, row: B, number: 3, label: "Right return - from Motor 3", kicadPinName: "M3(-)" }
      - { id: B4, row: B, number: 4, label: "Right return - from Motor 5", kicadPinName: "M5(-)" }
      - { id: B5, row: B, number: 5, label: "Left return - from BTS2 M- (driver output)", kicadPinName: "BTS2(M-)" }
      - { id: B6, row: B, number: 6, label: "Left return - from Motor 2", kicadPinName: "M2(-)" }
      - { id: B7, row: B, number: 7, label: "Left return - from Motor 4", kicadPinName: "M4(-)" }
      - { id: B8, row: B, number: 8, label: "Left return - from Motor 6", kicadPinName: "M6(-)" }
    bondedGroups:
      - id: right-power
        points: [A1, A2, A3, A4]
        notes: "Hardwire jumper bar across these 4 positions"
      - id: left-power
        points: [A5, A6, A7, A8]
        notes: "Hardwire jumper bar across these 4 positions"
      - id: right-return
        points: [B1, B2, B3, B4]
        notes: "Hardwire jumper bar across these 4 positions"
      - id: left-return
        points: [B5, B6, B7, B8]
        notes: "Hardwire jumper bar across these 4 positions"

  # --- off-board component ----------------------------------------------------
  # Anything not physically on the custom PCB: microcontroller, motor
  # drivers, motors, servos, UBECs, receiver, etc. Add one entry per part.
  - id: esp32
    componentType: offBoard
    name: "ESP32-S3"
    model: "ESP32-WROOM/S3"
    notes: ""
    connectionPoints:
      - id: GPIO7
        label: "Servo signal - S2 (Left-Front)"
        kicadPinName: "Servo_signal-S2(LF)"
      - id: GPIO10
        label: "BTS #2 - pin 1"
        kicadPinName: "BTS2-pin1"
      - id: GPIO11
        label: "BTS #2 - pin 2"
        kicadPinName: "BTS2-pin2"
      - id: GPIO12
        label: "BTS #1 - pin 1"
        kicadPinName: "BTS1-pin1"
      - id: GPIO13
        label: "BTS #1 - pin 2"
        kicadPinName: "BTS1-pin2"
      - id: GPIO21
        label: "ELRS RX (white wire)"
        kicadPinName: "ELRS_RX(white)"
      - id: GPIO38
        label: "Servo signal - S4 (Left-Rear)"
        kicadPinName: "Servo_signal-S4(LR)"
      - id: GPIO41
        label: "Servo signal - S3 (Right-Rear)"
        kicadPinName: "Servo_signal-S3(RR)"
      - id: GPIO42
        label: "Servo signal - S1 (Right-Front)"
        kicadPinName: "Servo_signal-S1(RF)"
      - id: GPIO47
        label: "ELRS TX (green wire)"
        kicadPinName: "ELRS_TX(green)"
      - id: 5V_IN
        label: "5V power in"
        kicadPinName: "5V_IN"
      - id: GND_1
        label: "Ground (near 5V IN)"
        kicadPinName: "Ground(near_5V_IN)"
      - id: GND_2
        label: "Ground (near TX)"
        kicadPinName: "Ground(near_TX)"

  # --- off-board component: small solder-mounted UBEC --------------------
  # Physically tiny (smaller than a postage stamp) and intended to be
  # mounted directly on the board, but it's still a separate module with
  # its own 4 pins — same offBoard/board-socket pattern as the ESP32, just
  # soldered directly rather than plugged into a socket header.
  - id: u2
    componentType: offBoard
    name: "UBEC 5V/3A"
    model: ""
    notes: "Supplies 5V rail to ESP32, servos, and motor driver signal pins."
    connectionPoints:
      - id: IN+
        label: "Input +"
        kicadPinName: "Input_+"
      - id: IN-
        label: "Input -"
        kicadPinName: "Input_-"
      - id: OUT+
        label: "Output +"
        kicadPinName: "Output_+"
      - id: OUT-
        label: "Output -"
        kicadPinName: "Output_-"

  # --- off-board component: motor drivers (BTS7960 / IBT_2 modules) ------
  # B-/B+/M-/M+ are the high-current screw terminals — these wire DIRECTLY
  # to the terminal blocks, bypassing the board entirely, per the earlier
  # guidance about not routing pack-level current across the small PCB.
  # Pins 1/2/3/4/7/8 are low-current logic pins and DO route through the
  # board (see board-main's J_BTS1.*/J_BTS2.* connector points).
  - id: BTS1
    componentType: offBoard
    name: "Motor Driver #1 (BTS7960/IBT_2)"
    model: "BTS7960/IBT_2"
    notes: "Drives right-side motors (M1, M3, M5) via tb-motor-bus."
    connectionPoints:
      - { id: "B-", label: "Motor supply B- (screw terminal)", kicadPinName: "Motor_supply_B-(screw)" }
      - { id: "B+", label: "Motor supply B+ (screw terminal)", kicadPinName: "Motor_supply_B+(screw)" }
      - { id: "M-", label: "Motor output M- (screw terminal)", kicadPinName: "Motor_output_M-(screw)" }
      - { id: "M+", label: "Motor output M+ (screw terminal)", kicadPinName: "Motor_output_M+(screw)" }
      - { id: PIN1_RPWM, label: "Pin 1 - R-PWM", kicadPinName: "Pin1-R-PWM" }
      - { id: PIN2_LPWM, label: "Pin 2 - L-PWM", kicadPinName: "Pin2-L-PWM" }
      - { id: PIN3_REN, label: "Pin 3 - R-EN", kicadPinName: "Pin3-R-EN" }
      - { id: PIN4_LEN, label: "Pin 4 - L-EN", kicadPinName: "Pin4-L-EN" }
      - { id: PIN7_VCC, label: "Pin 7 - VCC", kicadPinName: "Pin7-VCC" }
      - { id: PIN8_GND, label: "Pin 8 - GND", kicadPinName: "Pin8-GND" }

  - id: BTS2
    componentType: offBoard
    name: "Motor Driver #2 (BTS7960/IBT_2)"
    model: "BTS7960/IBT_2"
    notes: "Drives left-side motors (M2, M4, M6) via tb-motor-bus."
    connectionPoints:
      - { id: "B-", label: "Motor supply B- (screw terminal)", kicadPinName: "Motor_supply_B-(screw)" }
      - { id: "B+", label: "Motor supply B+ (screw terminal)", kicadPinName: "Motor_supply_B+(screw)" }
      - { id: "M-", label: "Motor output M- (screw terminal)", kicadPinName: "Motor_output_M-(screw)" }
      - { id: "M+", label: "Motor output M+ (screw terminal)", kicadPinName: "Motor_output_M+(screw)" }
      - { id: PIN1_RPWM, label: "Pin 1 - R-PWM", kicadPinName: "Pin1-R-PWM" }
      - { id: PIN2_LPWM, label: "Pin 2 - L-PWM", kicadPinName: "Pin2-L-PWM" }
      - { id: PIN3_REN, label: "Pin 3 - R-EN", kicadPinName: "Pin3-R-EN" }
      - { id: PIN4_LEN, label: "Pin 4 - L-EN", kicadPinName: "Pin4-L-EN" }
      - { id: PIN7_VCC, label: "Pin 7 - VCC", kicadPinName: "Pin7-VCC" }
      - { id: PIN8_GND, label: "Pin 8 - GND", kicadPinName: "Pin8-GND" }

  # --- off-board component: 6V/8A UBEC (servo power) ----------------------
  # Input comes straight from tb-power-dist (bypasses the board, like
  # BTS1/BTS2's high-current terminals); regulated 6V output enters the
  # board via screw terminals that feed the servo power bus.
  - id: U1
    componentType: offBoard
    name: "UBEC 6V/8A"
    model: ""
    notes: "Supplies 6V servo power bus (S1-S4)."
    connectionPoints:
      - id: IN+
        label: "Input + (red wire)"
        kicadPinName: "U1-IN-POS"
      - id: IN-
        label: "Input - (black wire)"
        kicadPinName: "U1-IN-NEG"
      - id: OUT+
        label: "Output + (6V)"
        kicadPinName: "U1-6VOUT-POS"
      - id: OUT-
        label: "Output - (6V)"
        kicadPinName: "U1-6VOUT-NEG"

  # --- off-board component: ELRS receiver ---------------------------------
  # RadioMaster RP3-V2. Wire colors per docs/elrs-wiring.md: red=VCC,
  # black=GND, green=TX (receiver output), white=RX (receiver input).
  - id: ELRS
    componentType: offBoard
    name: "ELRS Receiver (RadioMaster RP3-V2)"
    model: "RadioMaster ELRS-RP3-V2"
    notes: ""
    connectionPoints:
      - id: VCC
        label: "VCC (red wire)"
        kicadPinName: "VCC_(red)"
      - id: GND
        label: "GND (black wire)"
        kicadPinName: "GND_(black)"
      - id: TX
        label: "TX - receiver output (green wire)"
        kicadPinName: "TX-rcv_out(green)"
      - id: RX
        label: "RX - receiver input (white wire)"
        kicadPinName: "RX-rcv_in(white)"

  # --- off-board components: motors ---------------------------------------
  # Shells only — wiring to tb-motor-bus not yet defined.
  - id: M1
    componentType: offBoard
    name: "Motor 1 (Right - Wheel 1)"
    model: "GA25 DC gear motor"
    notes: ""
    connectionPoints:
      - { id: "+", label: "Motor +", kicadPinName: "Motor_+" }
      - { id: "-", label: "Motor -", kicadPinName: "Motor_-" }
  - id: M2
    componentType: offBoard
    name: "Motor 2 (Left - Wheel 2)"
    model: "GA25 DC gear motor"
    notes: ""
    connectionPoints:
      - { id: "+", label: "Motor +", kicadPinName: "Motor_+" }
      - { id: "-", label: "Motor -", kicadPinName: "Motor_-" }
  - id: M3
    componentType: offBoard
    name: "Motor 3 (Right - Wheel 3)"
    model: "GA25 DC gear motor"
    notes: ""
    connectionPoints:
      - { id: "+", label: "Motor +", kicadPinName: "Motor_+" }
      - { id: "-", label: "Motor -", kicadPinName: "Motor_-" }
  - id: M4
    componentType: offBoard
    name: "Motor 4 (Left - Wheel 4)"
    model: "GA25 DC gear motor"
    notes: ""
    connectionPoints:
      - { id: "+", label: "Motor +", kicadPinName: "Motor_+" }
      - { id: "-", label: "Motor -", kicadPinName: "Motor_-" }
  - id: M5
    componentType: offBoard
    name: "Motor 5 (Right - Wheel 5)"
    model: "GA25 DC gear motor"
    notes: ""
    connectionPoints:
      - { id: "+", label: "Motor +", kicadPinName: "Motor_+" }
      - { id: "-", label: "Motor -", kicadPinName: "Motor_-" }
  - id: M6
    componentType: offBoard
    name: "Motor 6 (Left - Wheel 6)"
    model: "GA25 DC gear motor"
    notes: ""
    connectionPoints:
      - { id: "+", label: "Motor +", kicadPinName: "Motor_+" }
      - { id: "-", label: "Motor -", kicadPinName: "Motor_-" }

  # --- off-board components: servos ---------------------------------------
  # Shells only — power bus and board connectors not yet defined
  # (pending the 6V/8A UBEC "U1").
  - id: S1
    componentType: offBoard
    name: "Servo 1 (Right-Front - Wheel 1)"
    model: "MS24 servo"
    notes: ""
    connectionPoints:
      - { id: SIG, label: "Signal (GPIO42, per ESP32 wiring instructions)", kicadPinName: "Signal(GPIO42)" }
      - { id: PWR, label: "Power (6V)", kicadPinName: "Power(6V)" }
      - { id: GND, label: "Ground", kicadPinName: "Ground" }
  - id: S2
    componentType: offBoard
    name: "Servo 2 (Left-Front - Wheel 2)"
    model: "MS24 servo"
    notes: ""
    connectionPoints:
      - { id: SIG, label: "Signal (GPIO7, per ESP32 wiring instructions)", kicadPinName: "Signal(GPIO7)" }
      - { id: PWR, label: "Power (6V)", kicadPinName: "Power(6V)" }
      - { id: GND, label: "Ground", kicadPinName: "Ground" }
  - id: S3
    componentType: offBoard
    name: "Servo 3 (Right-Rear - Wheel 5)"
    model: "MS24 servo"
    notes: ""
    connectionPoints:
      - { id: SIG, label: "Signal (GPIO41, per ESP32 wiring instructions)", kicadPinName: "Signal(GPIO41)" }
      - { id: PWR, label: "Power (6V)", kicadPinName: "Power(6V)" }
      - { id: GND, label: "Ground", kicadPinName: "Ground" }
  - id: S4
    componentType: offBoard
    name: "Servo 4 (Left-Rear - Wheel 6)"
    model: "MS24 servo"
    notes: ""
    connectionPoints:
      - { id: SIG, label: "Signal (GPIO38, per ESP32 wiring instructions)", kicadPinName: "Signal(GPIO38)" }
      - { id: PWR, label: "Power (6V)", kicadPinName: "Power(6V)" }
      - { id: GND, label: "Ground", kicadPinName: "Ground" }

  # --- board (custom PCB) -----------------------------------------------------
  # The physical board being designed in KiCad. Its connection points are
  # the headers/pads/screw-terminals exposed on the board edge, which is
  # what off-board components and terminal blocks wire into.
  - id: board-main
    componentType: board
    name: "Papaya Pathfinder PCB"
    widthMm: 70
    lengthMm: 90
    kicadProject: "pathfinder/kicad/papaya-pcb"
    notes: ""
    connectionPoints:
      # id = KiCad connector reference designator + pin (e.g. "J1.1"),
      # once real connectors/designators exist in the .kicad_sch.
      # J1 = main battery power in, feeding the UBEC 5V/3A branch. NOTE:
      # this carries raw 3S pack voltage, NOT 5V — "J_UBEC5V" downstream
      # is just the module's own name, not the voltage present at J1.
      - id: J1.1
        label: "Main battery power IN (raw 3S voltage, feeds UBEC 5V/3A input)"
        kicadPinName: "Main_power_IN(feeds_U2)"
        connector: {type: screwTerminal, notes: "High-current feed — size terminal/pad for total downstream current", footprint: "TerminalBlock:TerminalBlock_MaiXu_MX126-5.0-02P_1x02_P5.00mm" }
      - id: J1.2
        label: "" # e.g. "GND"
        kicadPinName: "J1.2"
        connector: {type: screwTerminal, footprint: "TerminalBlock:TerminalBlock_MaiXu_MX126-5.0-02P_1x02_P5.00mm" }
      # Example: a socket header the ESP32 module plugs into, plus a
      # header pin that routes on (via internal trace) to a servo
      # connector — illustrates the offBoard-module -> board-connector
      # -> board-connector pattern discussed for the ESP32.
      - id: J_ESP32.7
        label: "ESP32 GPIO7 (socket pin)"
        kicadPinName: "ESP32_GPIO7-S2-LF-signal(socket)"
        connector: {type: socketHeader, footprint: "papaya-pcb:ESP32S3_DevKit_2x1x22_split" }
      - id: J_ESP32.5V
        label: "ESP32 5V IN (socket pin)"
        kicadPinName: "ESP32_5V_IN_(socket_pin)"
